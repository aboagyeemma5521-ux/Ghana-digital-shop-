<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bermart - Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#14294d;color:white;font-family:Arial;padding:25px}
main{max-width:420px;margin:70px auto;background:#203d6b;padding:25px;border-radius:15px}
input,button{width:100%;padding:14px;margin:10px 0;box-sizing:border-box;border-radius:8px}
input{border:1px solid #ccc}
button{background:#6687ff;color:white;border:0;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Bermart Data Shop</h1>
<h2>Create a new password</h2>
<p>Enter your new password below.</p>
<input id="password" type="password" placeholder="New password">
<input id="confirm" type="password" placeholder="Confirm new password">
<button onclick="changePassword()">Save New Password</button>
<p id="message"></p>
</main>

<script>
const db=window.supabase.createClient(
 "https://ejbbcyoggohjhegiwgqk.supabase.co",
 "sb_publishable_1K0d4Z4Z6JRh9sYkQqSjGg_3prYnHpP"
);

async function changePassword(){
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 const message=document.getElementById("message");

 if(password.length<8){
  message.textContent="Use at least 8 characters.";
  return;
 }
 if(password!==confirm){
  message.textContent="Passwords do not match.";
  return;
 }

 const {data,error}=await db.auth.updateUser({password});
 if(error){
  message.textContent=error.message;
  return;
 }
 message.textContent="Password updated. You can now sign in to Bermart Admin.";
}
</script>
</body>
</html>
